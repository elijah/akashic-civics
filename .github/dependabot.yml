version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "akashic-civics/maintainers"
    assignees:
      - "akashic-civics/dependabot-bot"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript*"
          - "jest*"
          - "@stryker-mutator/*"
      test-dependencies:
        patterns:
          - "fast-check*"