[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "akashic-civics-py"
version = "1.0.0"
description = "Python client for Akashic Civics disparity analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Akashic Civics Project"}
]
keywords = ["criminal-justice", "disparity", "statistics", "civics"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "isort",
]

[tool.setuptools]
packages = ["akashic_civics"]